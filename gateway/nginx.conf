events {}

http {
    # Docker DNS resolves services at request time, allowing unfinished services.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        set $user_service http://user-service:8001;
        set $payment_service http://payment-service:8082;
        set $student_service http://student-service:5071;

        # Chỉ định tuyến API công khai. KHÔNG định tuyến /internal.
        location /api/v1/auth/     { proxy_pass $user_service; }
        location /api/v1/users/    { proxy_pass $user_service; }
        location /api/v1/admin/    { proxy_pass $user_service; }
        # Public Student routes are read-only. Payment calls /api/Tuition/{id}/pay internally.
        location = /api/v1/students {
            limit_except GET { deny all; }
            proxy_method GET; # ASP.NET controllers expose GET; Nginx handles HEAD response headers.
            proxy_pass $student_service/api/Student$is_args$args;
        }
        # Existing lookup URI maps to Student's list of tuition records by MSSV.
        location ~ ^/api/v1/students/([^/]+)/tuition/?$ {
            limit_except GET { deny all; }
            proxy_method GET; # ASP.NET controllers expose GET; Nginx handles HEAD response headers.
            rewrite ^/api/v1/students/([^/]+)/tuition/?$ /api/Tuition/student/$1 break;
            proxy_pass $student_service;
        }
        location /api/v1/students/ {
            limit_except GET { deny all; }
            proxy_method GET; # ASP.NET controllers expose GET; Nginx handles HEAD response headers.
            rewrite ^/api/v1/students/(.*)$ /api/Student/$1 break;
            proxy_pass $student_service;
        }
        location = /api/v1/tuitions {
            limit_except GET { deny all; }
            proxy_method GET; # ASP.NET controllers expose GET; Nginx handles HEAD response headers.
            proxy_pass $student_service/api/Tuition$is_args$args;
        }
        location /api/v1/tuitions/ {
            limit_except GET { deny all; }
            proxy_method GET; # ASP.NET controllers expose GET; Nginx handles HEAD response headers.
            rewrite ^/api/v1/tuitions/(.*)$ /api/Tuition/$1 break;
            proxy_pass $student_service;
        }
        location = /api/v1/accounts { proxy_pass $payment_service; }
        location /api/v1/accounts/     { proxy_pass $payment_service; }
        location /api/v1/transactions  { proxy_pass $payment_service; }

        location /internal/ { return 404; }

        location / { return 404; }
    }
}
