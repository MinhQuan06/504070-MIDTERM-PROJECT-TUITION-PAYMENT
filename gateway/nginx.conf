events {}

http {
    # Địa chỉ service theo tên trong docker compose.
    # Cổng nội bộ dưới đây là đề xuất, đổi cho khớp khi viết từng service.
    upstream user_service    { server user-service:8001; }
    upstream payment_service { server payment-service:8002; }
    upstream student_service { server student-service:8003; }

    server {
        listen 80;

        # Chỉ định tuyến API công khai. KHÔNG định tuyến /internal.
        location /api/v1/auth/     { proxy_pass http://user_service; }
        location /api/v1/users/    { proxy_pass http://user_service; }
        location /api/v1/students/ { proxy_pass http://student_service; }
        location /api/v1/accounts/     { proxy_pass http://payment_service; }
        location /api/v1/transactions  { proxy_pass http://payment_service; }

        location /internal/ { return 404; }

        location / { return 404; }
    }
}
