# Hạ tầng dùng chung. Mỗi service bật dần khi đã có Dockerfile (xem phần comment bên dưới).
services:
  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user-db-data:/var/lib/postgresql/data
      - ./db/user:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - payment-db-data:/var/lib/postgresql/data
      - ./db/payment:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"

  student-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${STUDENT_DB_NAME}
      POSTGRES_USER: ${STUDENT_DB_USER}
      POSTGRES_PASSWORD: ${STUDENT_DB_PASSWORD}
    volumes:
      - student-db-data:/var/lib/postgresql/data
      - ./db/student:/docker-entrypoint-initdb.d:ro
    ports:
      - "5435:5432"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  # Nhận email gửi ra khi dev, xem tại http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  gateway:
    image: nginx:1.27
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    # Bật khi các service bên dưới đã chạy:
    # depends_on: [user-service, payment-service, student-service]

  # ---- Bỏ comment từng khối khi service đã có Dockerfile ----
  # user-service:
  #   build: ./services/user-service
  #   env_file: .env
  #   depends_on: [user-db]
  #
  # payment-service:
  #   build: ./services/payment-service
  #   env_file: .env
  #   depends_on: [payment-db, rabbitmq]
  #
  # student-service:
  #   build: ./services/student-service
  #   env_file: .env
  #   depends_on: [student-db]
  #
  # notification-service:
  #   build: ./services/notification-service
  #   env_file: .env
  #   depends_on: [rabbitmq, mailpit]

volumes:
  user-db-data:
  payment-db-data:
  student-db-data:
