# Hạ tầng dùng chung. Mỗi service bật dần khi đã có Dockerfile (xem phần comment bên dưới).
services:
  user-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${USER_DB_NAME:-user_db}
      MYSQL_USER: ${USER_DB_USER:-user_svc}
      MYSQL_PASSWORD: ${USER_DB_PASSWORD:-change_me_user}
      MYSQL_ROOT_PASSWORD: ${USER_DB_ROOT_PASSWORD:-change_me_user_root}
    volumes:
      - user-mysql-data:/var/lib/mysql
      - ./services/user-service/db/user_db.sql:/docker-entrypoint-initdb.d/user.sql:ro
    ports:
      - "127.0.0.1:${USER_DB_PORT:-3309}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1 FROM users LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  payment-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${PAYMENT_DB_NAME:-payment_db}
      MYSQL_USER: ${PAYMENT_DB_USER:-payment_svc}
      MYSQL_PASSWORD: ${PAYMENT_DB_PASSWORD:-change_me_payment}
      MYSQL_ROOT_PASSWORD: ${PAYMENT_DB_ROOT_PASSWORD:-change_me_payment_root}
    volumes:
      - payment-mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  student-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${STUDENT_DB_NAME:-student_db}
      MYSQL_USER: ${STUDENT_DB_USER:-student_svc}
      MYSQL_PASSWORD: ${STUDENT_DB_PASSWORD:-change_me_student}
      MYSQL_ROOT_PASSWORD: ${STUDENT_DB_ROOT_PASSWORD:-change_me_student_root}
    volumes:
      - student-mysql-data:/var/lib/mysql
      - ./services/student-service/db/student_db.sql:/docker-entrypoint-initdb.d/student.sql:ro
    ports:
      - "127.0.0.1:${STUDENT_DB_PORT:-3308}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1 FROM tuitions LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-notification}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-notification_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Nhận email gửi ra khi dev, xem tại http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  fontend:
    build: ./fontend
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  gateway:
    image: nginx:1.27
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      fontend:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      student-service:
        condition: service_started

  user-service:
    build: ./services/user-service
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${USER_DB_USER:-user_svc}:${USER_DB_PASSWORD:-change_me_user}@user-db:3306/${USER_DB_NAME:-user_db}?charset=utf8mb4
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      INTERNAL_API_KEY: ${USER_INTERNAL_API_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-ibanking-user-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ibanking-api}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      AUTO_CREATE_TABLES: "false"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      user-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  payment-service:
    build: ./services/payment-service
    init: true
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      OUTBOX_ENCRYPTION_KEY: ${OUTBOX_ENCRYPTION_KEY:-}
      SAGA_RECOVERY_ENABLED: ${SAGA_RECOVERY_ENABLED:-true}
      SAGA_POLL_DELAY_MS: ${SAGA_POLL_DELAY_MS:-1000}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      OUTBOX_POLL_DELAY_MS: ${OUTBOX_POLL_DELAY_MS:-1000}
      OUTBOX_CONFIRM_TIMEOUT_MS: ${OUTBOX_CONFIRM_TIMEOUT_MS:-5000}
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:mysql://payment-db:3306/${PAYMENT_DB_NAME:-payment_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_DB_USER:-payment_svc}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:-change_me_payment}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-notification}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-notification_dev}
      MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-false}
      USER_MOCK_ENABLED: ${PAYMENT_USER_MOCK_ENABLED:-${PAYMENT_MOCK_ENABLED:-false}}
      STUDENT_MOCK_ENABLED: ${PAYMENT_STUDENT_MOCK_ENABLED:-${PAYMENT_MOCK_ENABLED:-false}}
      USER_INTERNAL_API_KEY: ${USER_INTERNAL_API_KEY:-}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8001}
      STUDENT_SERVICE_URL: ${STUDENT_SERVICE_URL:-http://student-service:5071}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      user-service:
        condition: service_healthy
      student-service:
        condition: service_started
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  student-service:
    build: ./services/student-service
    init: true
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:5071
      Payment__InternalApiKey: ${USER_INTERNAL_API_KEY:-}
      ConnectionStrings__student_db: Server=student-db;Port=3306;Database=${STUDENT_DB_NAME:-student_db};User ID=${STUDENT_DB_USER:-student_svc};Password=${STUDENT_DB_PASSWORD:-change_me_student};
    ports:
      - "127.0.0.1:5071:5071"
    depends_on:
      student-db:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    init: true
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-notification}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-notification_dev}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${SMTP_FROM:-no-reply@tuition.local}
      MAX_RETRIES: ${NOTIFICATION_MAX_RETRIES:-3}
      RETRY_DELAY_MS: ${NOTIFICATION_RETRY_DELAY_MS:-5000}
      DEDUPE_DIR: /app/data/sent
    volumes:
      - notification-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  user-db-data: # Legacy PostgreSQL volume; preserved, not mounted.
  user-mysql-data:
  payment-mysql-data:
  student-db-data: # Legacy PostgreSQL volume, not mounted into MySQL.
  student-mysql-data:

  rabbitmq-data:
  notification-data:
