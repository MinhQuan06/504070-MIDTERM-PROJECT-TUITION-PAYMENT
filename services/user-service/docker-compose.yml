services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-local_mysql_dev_password}"
      MYSQL_DATABASE: user_db
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - user_auth_mysql_data:/var/lib/mysql
      - ./db/user_db.sql:/docker-entrypoint-initdb.d/01-user_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  user-auth-service:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-local_mysql_dev_password}@mysql:3306/user_db?charset=utf8mb4"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
      JWT_ISSUER: "${JWT_ISSUER:-ibanking-user-auth}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-ibanking-api}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-30}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}"
      AUTO_CREATE_TABLES: "false"
    ports:
      - "${AUTH_PORT:-8001}:8001"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  user_auth_mysql_data:
