server.port=${SERVER_PORT:8082}
spring.application.name=payment-service

# Database MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

app.rabbitmq.exchange=notification.exchange
app.rabbitmq.otp-queue=notification.otp.queue
app.rabbitmq.otp-routing-key=notification.otp
app.rabbitmq.payment-success-queue=notification.payment-success.queue
app.rabbitmq.payment-success-routing-key=notification.payment.success

# External Services (Mặc định tắt Mock khi ghép nối, hoặc điều khiển qua biến MOCK_ENABLED)
app.external-services.mock-enabled=${MOCK_ENABLED:false}
app.external-services.user-service-url=${USER_SERVICE_URL:http://localhost:8081}
app.external-services.student-service-url=${STUDENT_SERVICE_URL:http://localhost:5071}