server.port=${SERVER_PORT:8082}
spring.application.name=payment-service

# Database MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:payment_svc}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me_payment}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:notification}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:notification_dev}

app.rabbitmq.exchange=ibanking.events
app.rabbitmq.queue=notification.email
app.rabbitmq.otp-routing-key=OtpRequested
app.rabbitmq.payment-success-routing-key=PaymentSucceeded

# Independent service mocks; MOCK_ENABLED remains a legacy fallback.
app.external-services.mock-enabled=${MOCK_ENABLED:false}
app.external-services.user-mock-enabled=${USER_MOCK_ENABLED:${MOCK_ENABLED:false}}
app.external-services.student-mock-enabled=${STUDENT_MOCK_ENABLED:${MOCK_ENABLED:false}}
app.external-services.user-service-url=${USER_SERVICE_URL:http://localhost:8081}
app.external-services.student-service-url=${STUDENT_SERVICE_URL:http://localhost:5071}
# Durable outbox: OTP payloads encrypted at rest; key must survive application restarts.
app.outbox.encryption-key=${OUTBOX_ENCRYPTION_KEY}
app.outbox.enabled=${OUTBOX_ENABLED:true}
app.outbox.poll-delay-ms=${OUTBOX_POLL_DELAY_MS:1000}
app.outbox.confirm-timeout-ms=${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.connection-timeout=3000
