version: '3.8'
services:
  payment-db:
    image: mysql:8.0
    container_name: payment-mysql-db
    environment:
      MYSQL_DATABASE: payment_db
      MYSQL_ROOT_PASSWORD: password123
    ports:
      - "3307:3306"
    volumes:
      - payment_mysql_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ibanking-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Cổng giao tiếp AMQP cho Spring Boot và NestJS
      - "15672:15672" # Cổng giao diện Web UI quản lý (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  payment_mysql_data:
  rabbitmq_data: