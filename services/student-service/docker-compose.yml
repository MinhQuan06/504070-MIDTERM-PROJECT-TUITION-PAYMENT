version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL (Tự động nạp dữ liệu từ file db/student_db.sql)
  student-mysql:
    image: mysql:8.0
    container_name: student_mysql_container
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "student_db"
    ports:
      - "3306:3306"
    volumes:
      - ./db/student_db.sql:/docker-entrypoint-initdb.d/init.sql
      - student_mysql_data:/var/lib/mysql

  # 2. Dịch vụ Student API (.NET 10)
  student-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_api_container
    restart: always
    ports:
      - "5071:5071"
    depends_on:
      - student-mysql
    environment:
      - Payment__InternalApiKey=${USER_INTERNAL_API_KEY:-}
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__student_db=Server=student-mysql;Port=3306;Database=student_db;User ID=root;Password=;

volumes:
  student_mysql_data:
